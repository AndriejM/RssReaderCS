spring.application.name=rssreader
#spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
#spring.datasource.url=jdbc:hsqldb:file:${user.dir}/database/rssreader;hsqldb.default_table_type=cached
#spring.datasource.url=jdbc:hsqldb:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.url=${DB_URL:jdbc:h2:file:~/data/rssreader;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_LOGIN:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.database-platform=${DB_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.liquibase.change-log=classpath:db/changelog/liquibase-changeLog.xml
logging.level.pl.andriejsoft=debug
